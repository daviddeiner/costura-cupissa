<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><meta name="robots" content="noindex,nofollow"><title>Costura CUPISSA</title><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="app.js"></script></head><body><header><div class="brand"><img src="logo.png" alt="CUPISSA"><strong>Costura</strong><button id="logout" hidden>Cerrar sesión</button></div><div class="install-row"><button id="install">Descargar app</button></div><div id="filters" hidden><p id="today"></p><div class="filters"><button id="prev" aria-label="Día anterior">‹</button><input id="date" type="date" aria-label="Fecha de entrega"><button id="next" aria-label="Día siguiente">›</button><button id="todayBtn">Hoy</button><button id="all">Todos</button></div><div class="summary"><span id="count"></span><button id="refresh">Actualizar</button></div></div></header><main><form id="login"><h1>Departamento de costura</h1><p>Acceso exclusivo a personal autorizado.</p><label>Correo<input type="email" id="email" autocomplete="username" required></label><label>Contraseña<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Iniciar sesión</button></form><p id="status" role="status" aria-live="polite"></p><section id="orders" aria-label="Pedidos pendientes"></section><button id="more" hidden>Cargar más pedidos</button></main><dialog id="photo"><button id="closePhoto" aria-label="Cerrar imagen">×</button><img id="largePhoto" alt="Foto del pedido"></dialog><dialog id="installHelp"><h2>Instalar Costura CUPISSA</h2><p id="installInstructions"></p><button id="closeInstall">Cerrar</button></dialog><script defer src="install.js"></script></body></html>
